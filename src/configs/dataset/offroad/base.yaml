# @package dataset
# Base for offroad datasets. Mirrors dino_wm/base.yaml's shape so that
# create_train_val_datasets receives the same set of loader kwargs.

loader:
  # Filled in by per-dataset configs:
  data_path_train: null
  data_path_val: null
  # Optional cached-latent path. The TartanDrive DataSource splits this by
  # appending the same basename as data_path_{train,val}; see tartandrive.yaml.
  latents_path: null
  use_cached_latents: false

  n_rollout: null
  split_ratio: 0.9
  validation_size: 32
  validation_fixed_subset_path: null
  validation_fixed_subset_size: null
  validation_fixed_subset_seed: 42

  normalize_state: false
  # TartanDrive actions are nominally in [-1, 1]; verify with stats.json
  # after preprocessing and flip this if your stats are out of range.
  normalize_action: false

  train_slice_mode: "random"
  val_slice_mode: "exhaustive"
  stride: 1
  random_seed: 42
  resize_mode: "stretch"
