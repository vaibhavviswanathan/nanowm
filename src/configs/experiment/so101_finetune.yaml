# SO-101 finetune on a self-collected task corpus, starting from the
# pretrain checkpoint produced by so101_pretrain.yaml.
#
# Driven by `scripts/finetune_so101_multigpu.sh` which sets the
# `experiment.resume_from_checkpoint` override at launch (filename contains
# `=` chars so it MUST be wrapped in Hydra-style single quotes from the
# shell).
#
# Hyperparameter rationale:
#   - lr: 10x lower than pretrain (1e-4 -> 1e-5). The pretrain ckpt already
#     sits near a good basin; finetune is small-perturbation territory.
#   - max_steps: 8000. Finetune corpus is ~41k frames @ 15 fps. At eff_bs=32
#     with 16-frame clips that's ~80 epochs of unique-clip coverage at 8k
#     steps — already deep into "the model has memorized the data" territory
#     for a finetune. Calibrated against TartanDrive precedent: B/2 peaks
#     fast on small data (exp06 peak at 4k on 9k frames).
#   - val_every_n_steps: 1000. More frequent val so we can early-stop if
#     val_loss starts climbing (it will, eventually).
#   - warmup: 200. Don't need a long warmup when starting from a healthy ckpt.

defaults:
  - so101_pretrain

training:
  optimizer:
    lr: 1.0e-5
    lr_warmup_steps: 200
  max_steps: 8000
  val_every_n_steps: 1000
  log_every: 50

evaluation:
  validation_size: 16
  metrics:
    evaluate: false           # FVD/I3D still off — same reason as pretrain
    log_every_n_train_steps: 1000
    buffer_size: 16

