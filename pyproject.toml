[project]
name = "nanowm-manipulation"
version = "0.1.0"
description = "SO-101 manipulation x nano-world-model POC (worktree of nanowm-tartandrive)"
# Manipulation worktree: bumped from main's >=3.10,<3.12 because the SO-101
# DataSource depends on `lerobot`, which requires Python 3.12+ and a newer
# diffusers than the main project's pinned 0.24.0. Main repo's TartanDrive
# work continues to use 3.10 in its own venv.
requires-python = ">=3.12"
dependencies = [
    # Core
    "numpy>=2.0,<2.3",  # bumped from <2 — lerobot wants 2.x.
    "scipy",
    "pillow",
    "tqdm",
    "requests",

    # Torch + torchvision pinned to 2.7 for the torchcodec=0.7 ABI match
    # (torchcodec is lerobot's video decoder; tight ABI dependency on torch).
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",

    # PyTorch ecosystem
    "timm",
    "einops",
    "lpips",
    "piqa",
    # Lightning 2.x is required for Python 3.12 (1.9.5 doesn't ship 3.12 wheels).
    # Upstream's train_experiment.py uses the 2.x API (`LightningModule`, etc.)
    # so this should be a clean bump.
    "pytorch-lightning>=2.2,<3",
    "torchmetrics",

    # Diffusion / generative
    # Bumped from 0.24.0 to satisfy lerobot. We use only the inference VAE
    # encode/decode API (vae.encode().latent_dist + vae.decode().sample +
    # vae.config.scaling_factor), all stable since 0.21 — bumping is safe.
    "diffusers[torch]>=0.27.2,<0.31",
    "accelerate",
    "transformers",
    "huggingface-hub",
    "lerobot",
    # torchcodec's wheel must match the torch ABI exactly. lerobot pulls 0.10
    # which was built against torch 2.9-nightly; pin to 0.7 paired with torch 2.7.
    "torchcodec>=0.7,<0.8",

    # Config & logging
    "omegaconf",
    "hydra-core",
    "tensorboard",
    "wandb",

    # Data
    "decord",
    "h5py",
    "pandas",

    # Image / video
    "opencv-python",
    "imageio",
    "imageio-ffmpeg",
    "moviepy==1.0.3",
    "scikit-image",
    "av",

    # Eval
    "pytorch-fid",
    "matplotlib",
    "seaborn",

    # Misc
    "sentencepiece",
    "beautifulsoup4",
    "ftfy",
    "protobuf==4.25.3",
    "boto3",  # TartanDrive bucket listing (kept so the main repo's scripts/ still works in this venv)
    "colorama",  # download_files.py imports it
    "rosbags",  # pure-Python rosbag reader for bag-to-tensor conversion
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist",
    "ruff",
]

[tool.uv]
# Resolve only for linux; the pytorch cu126 wheel index doesn't host
# darwin/win32 builds at these pins.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import resolution: upstream's tree is canonical (our scaffold dirs are
# symlinked into it). Adding "." would shadow upstream's src/ with our partial
# scaffold mirror — don't do it.
pythonpath = ["nano-world-model"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
